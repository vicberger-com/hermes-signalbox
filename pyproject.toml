[build-system]
requires = ["hatchling>=1.27,<2"]  # the lock pins the exact version used in CI and releases (H1 D-25)
build-backend = "hatchling.build"

[project]
name = "hermes-switchyard"
version = "1.0.1"
description = "Security-first, modular control plane for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vic Berger" }]
keywords = ["hermes-agent", "control-plane", "model-routing", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",  # H1 D-14: until there is external use or an external review
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "hatchling>=1.27", "editables>=0.5", "build>=1.2"]
security = ["bandit>=1.7", "pip-audit>=2.7", "cyclonedx-bom>=4.5", "pip-licenses>=5"]

[project.urls]
Repository = "https://github.com/vicberger-com/hermes-switchyard"

[project.scripts]
switchyard = "switchyard.cli:main"

[project.entry-points."hermes_agent.plugins"]
switchyard = "switchyard.hermes"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard"]

# H1 D-5: the Hermes plugin manifest and the dashboard tab ship in the wheel too. Hermes 0.23.2 shows dashboard
# tabs only for plugins installed into a plugins directory (`hermes plugins install`), not for pip entry points;
# see docs/USER-GUIDE.md section 5. Files are listed one by one so no local cache file is packaged.
[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "switchyard/_plugin/plugin.yaml"
"dashboard/manifest.json" = "switchyard/_plugin/dashboard/manifest.json"
"dashboard/plugin_api.py" = "switchyard/_plugin/dashboard/plugin_api.py"
"dashboard/dist/index.js" = "switchyard/_plugin/dashboard/dist/index.js"
"dashboard/dist/style.css" = "switchyard/_plugin/dashboard/dist/style.css"

[tool.pytest.ini_options]
testpaths = ["tests", "templates/module/tests"]
pythonpath = ["tools", "templates/module", "tests"]
addopts = "-q --strict-markers --import-mode=importlib --cov=switchyard --cov-branch --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
extend-exclude = ["tests/fixtures"]  # seeded-vulnerability fixtures for the scanner tests
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
# Bundled modules build SQL only from constants and ctx.state.table() names; values are always bound.
# Bandit's B608 is still marked per line with "nosec B608".
"src/switchyard/modules/secrets/secrets_module.py" = ["S608"]
"src/switchyard/modules/resources/resources_module.py" = ["S608"]
"src/switchyard/modules/router/router_module.py" = ["S608"]
"src/switchyard/modules/meter/meter_module.py" = ["S608"]
"src/switchyard/modules/activation/activation_module.py" = ["S608"]
"src/switchyard/modules/supervisor/supervisor_module.py" = ["S608"]
"src/switchyard/modules/workers/workers_module.py" = ["S608"]
"src/switchyard/modules/trimmer/trimmer_module.py" = ["S608"]
"src/switchyard/modules/inbox/inbox_module.py" = ["S608"]
"src/switchyard/modules/scanner/scanner_module.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tools", "templates/module/example.py"]
# The repository root carries a Hermes plugin shim (__init__.py); map packages from these bases instead.
explicit_package_bases = true
mypy_path = ["src", "tools", "templates/module"]
