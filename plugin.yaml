# Hermes plugin manifest (Hermes >= 0.22). Installed from git with `hermes plugins install`, or via pip through the
# `hermes_agent.plugins` entry point declared in pyproject.toml. Implementation: src/hermes_signalbox/hermes/__init__.py
manifest_version: 2
name: signalbox
version: 1.1.0
description: "Security-first, modular control plane for Hermes: modules, capability grants, audit, secrets by reference."
author: Vic Berger
license: Apache-2.0
homepage: https://github.com/vicberger-com/hermes-signalbox
requires_hermes: ">=0.22"
# No runtime dependencies (ADR-0001): Hermes must not install this repository into its shared environment (a
# [build-system] in pyproject.toml would otherwise make it a package to admit; 1.1 S-1).
python_runtime: external
provides_tools:
  - signalbox_modules
  - signalbox_audit
  - signalbox_host
provides_hooks:
  - api_request_error
  - post_api_request
  - post_llm_call
  - pre_api_request
  - pre_llm_call
  - subagent_start
  - subagent_stop
  - transform_terminal_output
  - transform_tool_result
provides_middleware:
  - llm_request
config_schema:
  data_dir:
    type: string
    description: "Absolute path for Signalbox state; default is this profile's plugin data directory."
