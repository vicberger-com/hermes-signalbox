# Bundled module M11: offload connectors. Spec: README.md in this directory.
schema = 1

[module]
id = "offload"
name = "Offload"
version = "0.12.0"
license = "Apache-2.0"
license_class = "open"
summary = "Sends suitable work to cheaper local resources: JevK5 typed decisions, n8n flows, and (when allowed by name) agent CLIs. Each connector declares license class, hosts and data sent."
docs = "https://github.com/vicberger-com/hermes-signalbox/blob/main/src/hermes_signalbox/modules/offload/README.md"
requires_core = ">=1.0,<2"
isolation = "in-process"
entry = "offload_module:OffloadModule"

[capabilities]
optional = ["process.spawn"]
request = ["net.outbound", "process.spawn", "ui.panel"]
programs = ["claude", "codex"]
net_hosts = ["127.0.0.1", "localhost"]

[contributes]
commands = ["connectors", "run", "report"]
panels = ["offload.status"]
log_streams = ["offload"]

[lifecycle]
activation = "manual"

[update]
source = "bundled"
