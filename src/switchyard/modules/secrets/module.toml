# Bundled module M1: secret backends, metadata and rotation. Spec: docs/modules/m1-secrets.md
schema = 1

[module]
id = "secrets"
name = "Secrets"
version = "0.2.0"
license = "Apache-2.0"
license_class = "open"
summary = "Secret backends (OS stores, Vaultwarden, development env), age and expiry by name, rotation."
requires_core = ">=0.1,<1"
isolation = "in-process"
entry = "secrets_module:SecretsModule"

[capabilities]
request = ["secrets.read", "process.spawn", "ui.panel"]
programs = ["bw", "secret-tool", "security"]  # Bitwarden CLI, libsecret, macOS keychain
net_hosts = []
secrets = []                      # provides backends; reads no secret itself (ADR-0002)

[contributes]
commands = ["status", "rotate", "expire"]
panels = ["secrets.status"]
log_streams = ["secrets"]
secret_backends = ["env", "wincred", "keychain", "secret-tool", "bw"]

[lifecycle]
activation = "auto"

[update]
source = "bundled"
