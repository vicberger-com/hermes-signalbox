name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot updates the pins.
# H1 D-3: nothing is published unless the tagged commit is on main, matches the project version, and passes the
# full gate again (verify). The release job runs in the `release` environment.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag is annotated
        # actions/checkout rewrites the pushed tag as a lightweight ref to the commit; fetch the real tag object.
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ] || {
            echo "::error::$GITHUB_REF_NAME is a lightweight tag"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Tag matches the project version
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests
        env:
          SWITCHYARD_CHECK_SKIPS: "1"
        run: python -m pytest -rs
      - run: bandit -q -r src tools templates dashboard -x '*/tests/*'
      - run: python -m build --no-isolation --outdir dist
      - run: python tools/check_dist.py dist
      - run: python tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifact
      # H1 D-6: the SBOM describes what ships: a clean environment with only the verified wheel installed.
      - run: python tools/check_dist.py artifact/dist --venv "$RUNNER_TEMP/shipped"
      - run: cyclonedx-py environment "$RUNNER_TEMP/shipped/bin/python" --output-format JSON --output-file artifact/dist/sbom.cdx.json
      - run: cd artifact/dist && sha256sum * > SHA256SUMS
      - name: Build provenance (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifact/dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifact/dist/* --verify-tag --notes-file artifact/release-notes.md
