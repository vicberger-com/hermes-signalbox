name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# P0 task: replace every version tag below with a full commit SHA.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build cyclonedx-bom
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Build provenance (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
