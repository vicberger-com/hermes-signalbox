name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot updates the pins.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install build cyclonedx-bom
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Build provenance (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
