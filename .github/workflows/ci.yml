name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; Dependabot updates the pins.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests (skipped set must match tests/skip_allowlist.json for this OS)
        env:
          SWITCHYARD_CHECK_SKIPS: "1"
        run: python -m pytest -rs
      - name: Validate module manifests
        shell: bash
        run: python tools/validate_manifest.py templates $([ -d modules ] && echo modules)
      - name: Check wiki source
        run: python tools/wiki_publish.py --check

  # H1 D-6: build the wheel and sdist, check the wheel's file list, install it into a clean environment and run
  # the CLI from it. A packaging break fails here, not at tag time.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m build --no-isolation --outdir dist
      - run: python tools/check_dist.py dist
      - name: Release notes exist for the version being built
        run: python tools/release_notes.py "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" > /dev/null

  # H1 D-4 (Question 9): the plugin against a real Hermes Agent, pinned to the commit of the release the
  # operator runs (v0.23.2). PyPI's hermes-agent stops at 0.19.0, so the pin is a git commit. Bump the SHA
  # in the same pull request that moves Switchyard to a newer Hermes.
  hermes-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_REF: ae2a81ccc00e9b7c06301523e5bb09608397149c # NousResearch/hermes-agent tag v0.23.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # Hermes v0.23.2 declares its dependencies for Python 3.14 only
      # Hermes refuses wheel builds, and its pyproject relies on uv overrides pip cannot apply, so it is
      # installed the way its developer setup does: a checkout at the pinned commit and `uv sync --frozen`
      # against its own uv.lock. uv itself is pinned by hash.
      - name: Install uv (pinned, hash-checked)
        run: |
          printf 'uv==0.13.7 --hash=sha256:2c9bdc4a872b60a93c5f26c0791089ea11585a4f9d3b3c017d78eb8487505e25\n' > "$RUNNER_TEMP/uv.txt"
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/uv.txt"
      - name: Install Hermes Agent at the pinned commit
        run: |
          git init -q "$RUNNER_TEMP/hermes-src"
          git -C "$RUNNER_TEMP/hermes-src" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent "$HERMES_REF"
          git -C "$RUNNER_TEMP/hermes-src" checkout -q FETCH_HEAD
          cd "$RUNNER_TEMP/hermes-src" && uv sync --frozen --python "$(command -v python)"
      - name: Add Switchyard and the test tools to that environment
        run: |
          HPY="$RUNNER_TEMP/hermes-src/.venv/bin/python"
          uv pip install --python "$HPY" --require-hashes -r tests/integration/requirements.txt
          uv pip install --python "$HPY" --no-deps -e .
          echo "HPY=$HPY" >> "$GITHUB_ENV"
      - name: Real-Hermes tests (must not skip)
        env:
          SWITCHYARD_REQUIRE_HERMES: "1"
        run: '"$HPY" -m pytest --no-cov -p no:randomly -rs tests/integration'

  # Single stable check to require in the branch ruleset; matrix job names change, this one does not.
  ci-required:
    if: always()
    needs: [test, package, hermes-integration]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
