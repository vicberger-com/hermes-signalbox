# Versions match requirements-dev.txt (ruff) and .github/workflows/security.yml (gitleaks); a test checks it.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: validate-manifests
        name: validate module manifests
        entry: python tools/validate_manifest.py
        language: system
        files: module\.toml$
